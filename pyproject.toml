[project]
name = "robofrontier-mini"
version = "0.1.0"
description = "Keyboard-controlled Panda picking in MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "glfw>=2.8,<3",
    "pillow>=11,<13",
    "scipy>=1.18.1",
]

[project.scripts]
robofrontier = "robofrontier.app:main"

[project.optional-dependencies]
oracle = ["greenlet==3.2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robofrontier"]
