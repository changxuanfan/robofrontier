<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboFrontier · 双会话通信测试</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#24352f;background:#f4f5ef}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1500px;margin:auto}h1{font-size:28px;margin:6px 0 10px}h2{font-size:18px}.muted{color:#63766d;font-size:13px}.pill{display:inline-block;border-radius:20px;background:#e2eade;padding:6px 12px;font-size:12px}section,.card{border:1px solid #dce3d7;background:#fff;border-radius:15px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{margin:0}.status{font-size:19px;font-weight:650;margin:12px 0}.bar{height:12px;background:#e4e8df;border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:#40795b;transition:width .5s}.message{padding:14px 0;border-bottom:1px solid #edf0e9}.message:last-child{border:0}.message p{margin:8px 0}.label{font-size:12px;color:#52685a}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}td,th{padding:9px;border-bottom:1px solid #edf0e9;vertical-align:top}details pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}#checks{display:flex;gap:10px;flex-wrap:wrap}.bad{background:#f7e5df}.good{background:#e1f0e1}@media(max-width:750px){body{padding:15px}.grid{grid-template-columns:1fr}}
.pill{max-width:100%;overflow-wrap:anywhere}section:last-of-type{overflow-x:auto}td,summary{overflow-wrap:anywhere}.card .muted{overflow-wrap:anywhere}
</style>
<body><span class="pill">RoboFrontier · 通信预实验</span><h1>两个真实 Codex 会话，一个异步工作群</h1>
<p class="muted">本轮不连接机械臂。后台任务独立计时；消息由真实 A/B 会话发送和处理。桌面任务的创建、START 与空闲唤醒由研发会话调度。</p>
<p id="run" class="muted"></p><div class="grid" id="agents"></div>
<section><h2>后台任务与启动门</h2><p id="work"></p><div class="bar"><i id="progress" style="width:0"></i></div><p id="start" class="muted"></p></section>
<section><h2>工作群 · 原始消息</h2><div id="messages"></div></section>
<section><h2>验收结果</h2><div id="checks">等待实验结束后核验</div></section>
<section><h2>完整事件时间线 <span id="count" class="muted"></span></h2><table><thead><tr><th>序号</th><th>本地时间</th><th>来源</th><th>事件</th><th>内容</th></tr></thead><tbody id="events"></tbody></table></section>
<script>
const $=s=>document.querySelector(s);const labels={NOT_STARTED:'尚未启动',READY:'已准备，等待 START',WORKING:'后台任务执行中',HANDLING_ACTIVE_MESSAGE:'正在处理运行中消息',WAITING_FOR_JOB:'消息已回复，任务继续执行',PHASE1_DONE:'第一阶段结束，等待平台确认空闲',THREAD_IDLE_CONFIRMED:'Codex 平台已确认会话空闲',WAIT_PHASE2:'等待第二阶段',SENDING_IDLE_MESSAGE:'正在发送空闲唤醒消息',WOKEN:'会话已恢复并检查邮箱',COMPLETE:'测试完成'};
const eventNames={RUN_CREATED:'创建运行',THREAD_BOUND:'绑定会话与模型',READY:'就绪',START:'统一开始',JOB_STARTED:'启动后台任务',JOB_PROGRESS:'后台任务持续推进',MESSAGE_SENT:'发出群消息',INBOX_READ:'检查邮箱',MESSAGE_HANDLED:'确认处理消息',AGENT_PHASE:'Agent 更新进度',JOB_FINISHED:'后台任务自然完成',THREAD_IDLE_CONFIRMED:'平台确认会话空闲',WAKE_DISPATCHED:'向空闲会话发送唤醒通知',VERIFICATION:'验收'};
const checkNames={both_ready_before_start:'A/B 就绪后统一 START',both_actual_luna_xhigh:'实际模型均为 Luna · Extra high',message_sent_while_work_running:'任务运行中发出消息',B_processed_and_replied_before_job_finished:'B 在任务完成前处理并回复',A_received_active_reply:'A 确认收到运行中回复',B_confirmed_idle_before_second_message:'第二条消息前平台确认 B 已空闲',idle_message_triggered_wake_and_handling:'空闲消息触发会话恢复与处理',B_replied_after_wake:'B 恢复后实际回复',A_received_idle_reply:'A 确认收到空闲唤醒回复'};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function render(s){$('#run').textContent=s.run_id+' · 更新 '+new Date(s.server_time).toLocaleTimeString();$('#agents').replaceChildren();for(const [a,v]of Object.entries(s.agents)){const n=el('div',undefined,'card');n.append(el('h2','Robot Agent '+a),el('div',labels[v.status]||v.status,'status'),el('p',(v.verified_model||v.requested_model)+' · '+(v.verified_effort||v.requested_effort)+(v.verified_model?' · 已核对实际设置':' · 等待实际设置核验'),'muted'),el('p','未处理消息 '+v.unread,'pill'),el('p',v.thread_id||'正在创建真实桌面任务','muted'));$('#agents').append(n)}const j=s.job;$('#work').textContent=j?'B-work-1 · '+(j.status==='RUNNING'?'运行中':'已自然完成')+' · '+j.elapsed_s.toFixed(1)+' / '+j.duration_s+' 秒':'等待 B 启动独立后台任务';$('#progress').style.width=(j?100*j.progress:0)+'%';$('#start').textContent=s.started_at?'START 已发布 · '+new Date(s.started_at).toLocaleTimeString():'仅当 A、B 均 READY 后允许 START';$('#messages').replaceChildren();if(!s.messages.length)$('#messages').textContent='暂无消息';for(const m of s.messages){const n=el('div',undefined,'message');n.append(el('div',m.from+' → '+m.to+' · '+m.key+' · '+new Date(m.sent_at).toLocaleTimeString(),'label'),el('p',m.text),el('div',m.handled_at?'已处理 · '+new Date(m.handled_at).toLocaleTimeString():'尚未确认处理','muted'));$('#messages').append(n)}if(s.verification){$('#checks').replaceChildren();for(const[k,v]of Object.entries(s.verification.checks))$('#checks').append(el('span',(v?'✓ ':'✗ ')+(checkNames[k]||k),'pill '+(v?'good':'bad')))}$('#count').textContent=s.events.length+' 条；底部为最新事件';$('#events').replaceChildren();for(const e of s.events){const tr=el('tr');tr.append(el('td',e.seq),el('td',new Date(e.timestamp).toLocaleTimeString()),el('td',e.actor),el('td',eventNames[e.kind]||e.kind));const td=el('td');const d=el('details');d.append(el('summary',JSON.stringify(e.details).slice(0,125)),el('pre',JSON.stringify(e.details,null,2)));td.append(d);tr.append(td);$('#events').append(tr)}}
let busy=false;async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){$('#run').textContent='连接暂不可用：'+e.message}finally{busy=false}}if(window.PILOT_SNAPSHOT){render(window.PILOT_SNAPSHOT);$('#run').textContent+=' · 保存的实验快照'}else{refresh();setInterval(refresh,1000)}
</script></body></html>
