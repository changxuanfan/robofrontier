<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboFrontier · 多视角</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#e7edf6;font:15px system-ui}header{position:sticky;top:0;background:#101722ed;padding:20px 28px;z-index:2;border-bottom:1px solid #2d3b50}h1{font-size:22px;margin:0 0 12px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#24334a;color:#edf4ff;border:1px solid #405572;border-radius:8px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.5}#status{color:#a8b8cb}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:24px}article{background:#192334;border:1px solid #2d3b50;border-radius:12px;overflow:hidden}article button{display:block;width:100%;border:0;text-align:left;border-radius:0;background:transparent}article h2{font-size:16px;margin:0;padding:12px 16px}img{width:100%;display:block;aspect-ratio:1.6;object-fit:contain;background:#0b1018}.hint{font-size:13px;color:#a8b8cb;margin-top:10px}dialog{width:min(95vw,1500px);padding:8px;background:#101722;border:1px solid #405572;border-radius:12px;color:white}dialog::backdrop{background:#000c}dialog button{float:right}@media(min-width:1100px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<header><h1>RoboFrontier · 一个世界，多个固定视角</h1><div class="tools"><button id="refresh">刷新全部视角</button><label>查看 <select id="filter"><option value="all">全部视角</option value="global">全局视角</option value="A">机械臂 A</option value="B">机械臂 B</option value="C">机械臂 C</option></select></label><label><input id="auto" type="checkbox"> 每 5 秒刷新</label><span id="status">正在连接…</span></div><div class="hint">点击画面放大。显示采集时刻的图像；刷新只观察，不启动、暂停或控制机械臂。自动刷新默认关闭。</div></header><main id="grid"></main><dialog id="zoom"><button onclick="document.querySelector('#zoom').close()">关闭</button><h2 id="zoomtitle"></h2><img id="zoomimg"></dialog>
<script>let cameras=[],busy=false,stamp=0;const grid=document.querySelector('#grid');
function configure(names){if(names.join('|')===cameras.join('|'))return;cameras=names;grid.replaceChildren();document.querySelector('#filter').options[0].textContent=`全部 ${names.length} 个`;const filter=document.querySelector('#filter');while(filter.options.length>2)filter.remove(2);const arms=new Set();for(const c of cameras){const label=c.replaceAll('_',' · '),a=document.createElement('article');a.dataset.camera=c;const h=document.createElement('h2');h.textContent=label;const button=document.createElement('button'),im=document.createElement('img');im.alt=label+'，尚未加载';button.append(im);a.append(h,button);button.onclick=()=>{document.querySelector('#zoomtitle').textContent=label;document.querySelector('#zoomimg').src=`/frames/${encodeURIComponent(c)}.png?t=${stamp}`;document.querySelector('#zoom').showModal()};grid.append(a);if(/_(front|side)$/.test(c)&&!c.startsWith('global'))arms.add(c.replace(/_(front|side)$/,''))}for(const arm of arms){const option=document.createElement('option');option.value=arm;option.textContent='机械臂 '+arm;filter.append(option)}}
async function refresh(){if(busy)return;busy=true;document.querySelector('#refresh').disabled=true;document.querySelector('#status').textContent='正在采集同一世界的配置视角…';try{const r=await fetch('/api/refresh',{method:'POST'});const s=await r.json();if(!r.ok||s.error)throw Error(s.error||'采集失败');configure(s.cameras);stamp=s.captured_at;for(const a of grid.children){const im=a.querySelector('img');im.src=`/frames/${a.dataset.camera}.png?t=${stamp}`;im.alt=a.querySelector('h2').textContent};document.querySelector('#status').textContent=`仿真 ${s.sim_time_s.toFixed(2)} s · 采集于 ${new Date(stamp*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Hong_Kong',hour12:false})}`}catch(e){document.querySelector('#status').textContent='无法采集：'+e.message}finally{busy=false;document.querySelector('#refresh').disabled=false}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#filter').onchange=e=>{const f=e.target.value;for(const a of grid.children)a.hidden=f!=='all'&&!(f==='global'?!(/_(front|side)$/.test(a.dataset.camera)&&!a.dataset.camera.startsWith('global')):a.dataset.camera.replace(/_(front|side)$/,'')===f)};setInterval(()=>{if(document.querySelector('#auto').checked)refresh()},5000);refresh();</script></html>
