<!doctype html><meta charset="utf-8"><title>RoboFrontier — Meta + Workers</title>
<style>body{background:#111827;color:#e5e7eb;font:15px system-ui;margin:32px}h1{font-size:24px}.cards{display:flex;gap:16px}.card{padding:18px;background:#1f2937;border-radius:12px;flex:1}pre{white-space:pre-wrap;word-break:break-word}section{margin-top:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #374151}.pill{color:#93c5fd}small{color:#9ca3af}</style>
<h1>RoboFrontier · 一个共享世界 · Meta 管理 · Coordinator＋Workers</h1><p id="run"></p><p id="health"></p><div class="cards" id="agents"></div>
<section><h2>进行中的动作</h2><div id="jobs"></div></section>
<section><h2>工作消息</h2><table><thead><tr><th>编号</th><th>发件人 → 收件人</th><th>正文</th></tr></thead><tbody id="messages"></tbody></table></section>
<section><h2>工程事件</h2><pre id="events"></pre></section>
<script>const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function refresh(){try{const s=await(await fetch('/state')).json();document.querySelector('#run').textContent=`仿真 ${s.sim_time_s.toFixed(1)} s · ${s.lifecycle==='interrupted'?'已中断':s.lifecycle==='recovery_required'?'需工程核实':s.ended?'已结束':s.started?'运行中':'等待 READY / START'} · ${s.recording?'正在录制':''}`;const h=s.dispatcher_health??{},ago=t=>t?Math.max(0,Math.round(Date.now()/1000-t))+' 秒前':'尚无记录';document.querySelector('#health').textContent=`调度观测：${ago(h.last_successful_observation_at)} · 最近投递：${ago(h.last_delivery_at)}${s.dispatcher_paused?' · 已暂停调度':''}${h.last_error?' · 最近错误：'+h.last_error.reason:''}`;document.querySelector('#agents').innerHTML=Object.entries(s.agents).sort(([a],[b])=>(a==='Meta'?-2:a==='Coordinator'?-1:0)-(b==='Meta'?-2:b==='Coordinator'?-1:0)).map(([a,v])=>`<div class="card"><b>${a}</b><p class="pill">会话：${esc(v.kind==='manager'?'实验管理':v.session_status??v.phase)}</p><p>自报工作：${esc(v.work_state??v.phase)}</p><p>${esc(v.note)}</p><small>待收件 ${s.unread[a]??0} 条</small></div>`).join('');document.querySelector('#jobs').innerHTML=Object.values(s.jobs).filter(j=>j.status==='running').map(j=>`<p>${esc(j.arm)} · ${esc(j.type)} · ${esc(j.action_id)}</p>`).join('')||'没有执行中的动作';document.querySelector('#messages').innerHTML=s.messages.slice(-80).reverse().map(m=>`<tr><td>${m.message_id}${m.reply_to?' ↩ '+esc(m.reply_to):''}</td><td>${esc(m.from)} → ${esc(m.to.join(', '))}</td><td>${esc(m.text)}</td></tr>`).join('');document.querySelector('#events').textContent=s.events.filter(e=>!['VIDEO_FRAME','TOOL_RETURN'].includes(e.kind)).slice(-20).map(e=>`${e.created_at?new Date(e.created_at*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Hong_Kong',hour12:false}):e.wall_s+'s'} ${e.actor} ${e.kind}`).join('\n')}catch(e){document.querySelector('#run').textContent='连接暂不可用'} }setInterval(refresh,1500);refresh();</script>
